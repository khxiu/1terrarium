<!-- Custom Terrarium Container -->
<div class="terrarium-wrapper">
  <section class="sqs-sequence-section">
    <div class="sqs-sequence-sticky">
      <canvas id="sqs-sequence-canvas"></canvas>
    </div>
  </section>
</div>

<style>
  .terrarium-wrapper {
    width: 100%;
    position: relative;
  }

  .sqs-sequence-section {
    position: relative;
    /* ADJUST SPEED HERE: Smaller height = faster scroll. Larger = slower scroll. */
    height: 350vh; 
    background: #fff;
  }

  .sqs-sequence-sticky {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    background: #fff;
  }

  #sqs-sequence-canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #fff;
    will-change: transform;
    transform: translate3d(0, 0, 0);
    -webkit-transform: translate3d(0, 0, 0);
  }
</style>

<!-- Load GSAP & ScrollTrigger dynamically -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script>
  (function() {
    gsap.registerPlugin(ScrollTrigger);

    ScrollTrigger.config({
      ignoreMobileResize: true
    });

    const canvas = document.getElementById("sqs-sequence-canvas");
    const ctx = canvas.getContext("2d");

    const TOTAL = 101; // Change to 147 if testing the AirPods demo sequence
    const images = [];
    const loaded = [];
    let loadedCount = 0;
    let renderedFrame = -1;

    let viewWidth = window.innerWidth;
    let viewHeight = window.innerHeight;
    let dpr = window.innerWidth < 768 ? 1 : Math.min(window.devicePixelRatio || 1, 2);

    function updateViewport() {
      viewWidth = canvas.parentElement.offsetWidth || window.innerWidth;
      viewHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;

      canvas.width = viewWidth * dpr;
      canvas.height = viewHeight * dpr;
      canvas.style.width = viewWidth + "px";
      canvas.style.height = viewHeight + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    updateViewport();

    // TO DO: Change this function to point to your hosted images
    function frameURL(i) {
      // 1. Swap with your GitHub CDN when ready:
      const baseURL = "https://cdn.jsdelivr.net/gh/YOUR_USERNAME/YOUR_REPO@main/";
      return baseURL + "ezgif-frame-" + String(i).padStart(3, "0") + ".png";

      // 2. Uncomment below if you want to test with the AirPods demo sequence:
      // const baseURL = "https://www.apple.com/105/media/us/airpods-pro/2019/1299e2f5_db5a_41d9_a41f_9fb0a207aed2/anim/sequence/large/01-hero-lightpass/";
      // return baseURL + String(i).padStart(4, "0") + ".jpg";
    }

    function preloadImages() {
      for (let i = 1; i <= TOTAL; i++) {
        const img = new Image();
        img.onload = function () {
          loaded[i - 1] = true;
          loadedCount++;
          if (i === 1) drawFrame(0);
        };
        img.onerror = function () {
          loaded[i - 1] = false;
          loadedCount++;
        };
        img.src = frameURL(i);
        images[i - 1] = img;
      }
    }

    preloadImages();

    function nearestFrame(index) {
      if (loaded[index]) return index;
      for (let i = index; i >= 0; i--) {
        if (loaded[i]) return i;
      }
      for (let i = index; i < TOTAL; i++) {
        if (loaded[i]) return i;
      }
      return -1;
    }

    function drawFrame(frame) {
      frame = Math.round(frame);
      frame = Math.max(0, Math.min(frame, TOTAL - 1));

      const index = nearestFrame(frame);
      if (index === -1) return;

      const img = images[index];
      if (!img || !img.complete) return;

      ctx.clearRect(0, 0, viewWidth, viewHeight);

      const scale = Math.max(
        viewWidth / img.naturalWidth,
        viewHeight / img.naturalHeight
      );

      const drawWidth = img.naturalWidth * scale;
      const drawHeight = img.naturalHeight * scale;

      const offsetY = window.innerWidth < 768 ? 40 : 20;
      const drawX = (viewWidth - drawWidth) / 2;
      const drawY = ((viewHeight - drawHeight) / 2) + offsetY;

      ctx.drawImage(img, drawX, drawY, drawWidth, drawHeight);
      renderedFrame = index;
    }

    const state = { frame: 0 };

    gsap.to(state, {
      frame: TOTAL - 1,
      ease: "none",
      onUpdate: function () {
        let frame = Math.round(state.frame);
        if (frame !== renderedFrame) {
          drawFrame(frame);
        }
      },
      scrollTrigger: {
        trigger: ".sqs-sequence-section",
        start: "top top",
        end: "bottom bottom",
        scrub: 0.5,
        pin: ".sqs-sequence-sticky", 
        invalidateOnRefresh: true,
        markers: false
      }
    });

    let resizeTimer;
    let lastWidth = window.innerWidth;

    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (window.innerWidth === lastWidth) return;
        lastWidth = window.innerWidth;

        dpr = window.innerWidth < 768 ? 1 : Math.min(window.devicePixelRatio || 1, 2);
        updateViewport();
        drawFrame(state.frame);
        ScrollTrigger.refresh();
      }, 150);
    });

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        lastWidth = window.innerWidth;
        dpr = window.innerWidth < 768 ? 1 : Math.min(window.devicePixelRatio || 1, 2);
        updateViewport();
        drawFrame(state.frame);
        ScrollTrigger.refresh();
      }, 300);
    });

    function init() {
      updateViewport();
      drawFrame(0);
      requestAnimationFrame(() => {
        ScrollTrigger.refresh();
      });
    }

    init();
  })();
</script>
